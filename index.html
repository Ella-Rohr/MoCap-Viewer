<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <title>MoCap Viewer - JMU Wearable Computing Lab</title>
    <link rel="stylesheet" href="index.css">
    <script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
          "jsm/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
        }
			}
		</script>
  </head>
  <body>
    <div id="file-input">
      <form id="file-form">
        <input type="file" id="mocapFile" name="filename" accept=".glb,.gltf">
        <button type="submit">Upload File</button>
      </form>
      <div>
        <button type="button" id="play-button" disabled>Play</button>
        <button type="button" id="pause-button" disabled>Pause</button>
        </div>
    </div>
    <script type="module" src="index.js"></script>
  </body>
</html>
